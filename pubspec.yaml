name: estateflow
description: "EstateFlow — real estate listing and client management, powered by Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.0.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.2.0
  image_picker: ^1.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
