<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="EstateFlow — property and client management for Pakistani real estate. Find, manage and grow.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0866F5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101D3A">

  <!-- Google sign-in on the web uses the Google Identity Services SDK. -->
  <meta name="google-signin-client_id" content="353372777164-q0v4tqjq4nag94cnnn9f4sp6mugnuav5.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EstateFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>EstateFlow — Real Estate Management</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F7F9FC;
    }
    #ef-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #F7F9FC;
      transition: opacity 180ms ease;
    }
    #ef-splash img {
      display: block;
      width: min(260px, 64vw);
      height: auto;
    }
    #ef-splash .dark-logo {
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body, #ef-splash {
        background: #101D3A;
      }
      #ef-splash .light-logo {
        display: none;
      }
      #ef-splash .dark-logo {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div id="ef-splash" aria-label="EstateFlow is loading">
    <img class="light-logo" src="estateflow-logo.png" alt="EstateFlow — Find, Manage, Grow">
    <img class="dark-logo" src="estateflow-logo-dark.png" alt="EstateFlow — Find, Manage, Grow">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('ef-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      window.setTimeout(function () { splash.remove(); }, 200);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
